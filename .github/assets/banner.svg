<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="AI Observability">
  <defs>
    <radialGradient id="glow" cx="78%" cy="40%" r="55%">
      <stop offset="0" stop-color="#4c9fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4c9fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0%" cy="100%" r="60%">
      <stop offset="0" stop-color="#4c9fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4c9fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a8d0ff"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c9fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4c9fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="#09090b"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>
    <rect width="1280" height="420" fill="url(#glow2)"/>
    
    <path d="M880 300 L920 290 L960 296 L1000 284 L1040 292 L1080 180 L1120 120 L1160 140 L1200 110 L1240 128 L1240 340 L880 340 Z" fill="url(#area)"/>
    <path d="M880 300 L920 290 L960 296 L1000 284 L1040 292 L1080 180 L1120 120 L1160 140 L1200 110 L1240 128" fill="none" stroke="#4c9fff" stroke-width="3" stroke-linejoin="round" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" from="900" to="0" dur="2.2s" fill="freeze"/></path>
    <line x1="1060" y1="70" x2="1060" y2="340" stroke="#a8d0ff" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 6"/>
    <rect x="1010" y="56" width="100" height="24" rx="12" fill="#0b1220" stroke="#a8d0ff" stroke-opacity="0.6"/>
    <text x="1060" y="72.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a8d0ff">deploy v1.42</text>
    <circle cx="1120" cy="120" r="7" fill="#ff5d6c"><animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <line x1="880" y1="340" x2="1240" y2="340" stroke="#ffffff" stroke-opacity="0.15"/>
    <g>
      <circle cx="80" cy="96" r="5" fill="#4c9fff"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="96" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.5" fill="#a8d0ff">LOGS · TRACES · ERRORS · INCIDENTS</text>
    </g>
    <text x="68" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="-3" fill="url(#title)">AI Observability</text>
    <text x="72" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#a1a1aa"><tspan x="72" dy="0">Ingest and correlate telemetry, then let AI analyze</tspan><tspan x="72" dy="30">production incidents from structured evidence.</tspan></text>
    <text x="72" y="364" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#71717a">NestJS · Next.js 16 · BullMQ · SSE · PostgreSQL · Gemini</text>
    <rect x="0.5" y="0.5" width="1279" height="419" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
